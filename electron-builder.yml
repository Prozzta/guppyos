appId: in.munderdiffl.app
productName: Guppy
# REBRAND-GUPPY (1.1.82, the Human 2026-10-03): the app and its exe are Guppy. Kept on purpose, so a
# 1.1.81 install upgrades in place: appId (the NSIS GUID derives from it: same install entry, same
# folder, same AUMID), package.json "name" (only the default userData; the app now uses
# <appData>/Guppy, src/main/userDataMigration.ts) and the munderdifflin:// scheme. The shortcuts
# and taskbar pins are re-aimed at Guppy.exe on update: build/installer.nsh.
# REBRAND-ARTIFACT-NAMES (1.1.83): the release files are Guppy-*. 1.1.81 (and older) build their
# manual-download link from fixed Munder-Difflin-* names, so afterAllArtifactBuild also writes a
# byte-identical Munder-Difflin-* copy of each file such a link names (build/legacyArtifactNames.cjs);
# the release uploads it, and tools/check-release-links.cjs --live requires it.
executableName: Guppy
copyright: Copyright © 2026 Chaitanya Giri
# REBRAND-FILEDESCRIPTION (1.1.83): Windows shows an exe's FileDescription as its name in Task
# Manager (and the setup exe's), and electron-builder fills it from the package "description"
# (winPackager.signAndEditResources, NsisTarget). So the packaged description is the app name.
# The source package.json keeps the long one, and so does Linux (linux.description below); the
# package "name" (munder-difflin) is untouched.
extraMetadata:
  description: Guppy

# Where electron-updater looks for new versions (latest*.yml + assets on GitHub
# releases). The release workflow still uploads assets itself (--publish never);
# this block only stamps app-update.yml into the packaged app so the updater
# knows which repo to poll.
publish:
  provider: github
  # The human's own repository ONLY — never the upstream project this was forked
  # from. It must agree with REPO in src/shared/updateState.ts; a test holds them
  # together.
  owner: Prozzta
  repo: guppyos

# Notarize + staple after signing, but only when APPLE_* creds are in the env
# (the hook no-ops otherwise, so contributor builds still work). Root-level hook.
afterSign: build/notarize.cjs
# NATIVE-MEMORY prune (spec section 5): keep only the TARGET platform/arch CPU runtime of
# onnxruntime-node (and drop DirectML, a GPU provider the engine never asks for). A hook, not a
# `files` list: a platform-level `files` REPLACES the top-level list (measured: it packed docs/,
# blog/ and the model twice into app.asar).
afterPack: build/afterPack-memory-prune.cjs
# REBRAND-ARTIFACT-NAMES: the Munder-Difflin-* copies 1.1.81 links to (see the header).
afterAllArtifactBuild: build/legacyArtifactNames.cjs

# Register the guppy:// URL scheme (shareable-hires deep link) and the old
# munderdifflin:// one (links already shared) in the packaged app: CFBundleURLTypes
# on macOS, the .desktop MimeType on Linux. On Windows the app registers both
# itself at every start (app.setAsDefaultProtocolClient in src/main/index.ts).
protocols:
  - name: Guppy
    schemes:
      - guppy
      - munderdifflin

# electron-vite emits the app into out/; package exactly that plus what the
# runtime needs. node-pty is native, so keep it out of the asar.
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.{md,map,ts,tsx}"
  - "!**/{.eslintrc,.prettierrc,tsconfig*.json,electron.vite.config.*}"
  # v0.3.4: shipped so the voice get_app_info tool (main 'app:info') can read release notes from
  # <appPath>/CHANGELOG.md. It MUST come AFTER the md exclude above: electron-builder applies these
  # patterns in order, so while it sat before "!**/*.md" it was removed again and never shipped
  # (CHANGELOG-NOT-PACKAGED, 1.1.73). scripts/verify-packaged-changelog.cjs checks the built asar.
  - CHANGELOG.md

# Ship the standalone Slack reply helper as a plain file under the app's
# resources dir (process.resourcesPath). It runs under `node`, NOT inside the
# asar, so the office worker can invoke `node <resources>/md-slack-reply.cjs`.
extraResources:
  - from: resources/md-slack-reply.cjs
    to: md-slack-reply.cjs
  # Knowledge Graph agent CLI + its pure-JS core. Agents invoke `node
  # <resources>/kg.cjs` out-of-process; kg-core.cjs ships beside it so the CLI's
  # `require('./kg-core.cjs')` resolves outside the asar.
  - from: resources/kg.cjs
    to: kg.cjs
  - from: src/main/kg-core.cjs
    to: kg-core.cjs
  # Bundled default skills (read-only/no-secret). copyBundledSkills() reads these
  # from skillsResourceDir() = <process.resourcesPath>/skills in the packaged app
  # and refreshes each agent's .claude/skills/ per spawn (dev resolves to
  # repo resources/skills). Directory copy preserves the <id>/SKILL.md tree.
  - from: resources/skills
    to: skills
  # NATIVE-MEMORY: the agent-facing `memory` command (run on Electron-as-Node from <hive>/bin/memory)
  # and the ONE bundled embedding model + its digest manifest (provisioned before a build by
  # scripts/fetch-memory-model.cjs; the app never downloads a model at runtime).
  - from: resources/memory-cli.cjs
    to: memory-cli.cjs
  # READS-181 A: the `ledger` command (card + outbox message + memory note in one call), run on
  # Electron-as-Node from <hive>/bin/ledger.
  - from: resources/ledger-cli.cjs
    to: ledger-cli.cjs
  - from: resources/models
    to: models
    filter:
      - native-memory-manifest.json
      - all-MiniLM-L6-v2/config.json
      - all-MiniLM-L6-v2/tokenizer.json
      - all-MiniLM-L6-v2/tokenizer_config.json
      - all-MiniLM-L6-v2/onnx/model.onnx

asarUnpack:
  - "**/node_modules/node-pty/**"
  # better-sqlite3 is native (bindings/prebuild need the .node on the real FS).
  - "**/node_modules/better-sqlite3/**"
  # NATIVE-MEMORY: native files must be on the real filesystem (a DLL cannot load from an asar).
  - "**/node_modules/onnxruntime-node/bin/**"
  - "**/node_modules/sqlite-vec-*/**"

# Rebuild native deps (node-pty) for the target during packaging.
npmRebuild: true

# ---- macOS ----
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Declare WHY the app touches the user's folders. macOS shows these strings in
  # the privacy prompt and, for a signed app, remembers the grant — so the user
  # is asked ONCE instead of on every agent action.
  extendInfo:
    NSDocumentsFolderUsageDescription: "Guppy runs your Claude Code agents, which read and write files in the project folders you point them at."
    NSDesktopFolderUsageDescription: "Guppy's agents may work on projects located on your Desktop."
    NSDownloadsFolderUsageDescription: "Guppy's agents may work on projects located in your Downloads."
    NSRemovableVolumesUsageDescription: "Guppy's agents may work on projects located on external volumes."
    NSNetworkVolumesUsageDescription: "Guppy's agents may work on projects located on network volumes."
    # The microphone is used by two opt-in, off-by-default voice features: Free
    # Flow dictation (Groq transcription) and Realtime Michael (live voice chat
    # with the orchestrator via OpenAI). Mic access only happens while one is on.
    NSMicrophoneUsageDescription: "Guppy uses your microphone only for its opt-in voice features: Free Flow dictation (transcribed by Groq into the message queue) and talking to Michael in real time (streamed to OpenAI). The mic is off unless you turn one of these on."
  # Hardened runtime + entitlements so the spawned `claude` agents inherit this
  # app's TCC responsibility (one grant covers them all) and node-pty can load.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Disable electron-builder's BUILT-IN notarization. It auto-triggers whenever the
  # APPLE_* env vars are present and runs inside signApp — a path our afterSign hook's
  # try/catch can't guard, so a bad-credential failure there hard-fails the whole
  # release (exactly what bit us). Instead, the root-level `afterSign: build/notarize.cjs`
  # hook does notarization best-effort: it tries, and on failure ships the signed (un-
  # notarized) build rather than sinking the cross-platform release. Notarization
  # resumes automatically once the APPLE_* secrets are valid — no further changes.
  notarize: false
  # Signing: TCC binds a remembered grant to a STABLE code signature, so a signed
  # build is asked for folder access ONCE. The "Developer ID Application" cert is
  # auto-discovered from the login keychain (CSC_IDENTITY_AUTO_DISCOVERY). If no
  # cert is found, electron-builder warns and produces an unsigned build, so
  # contributors without an Apple account can still build.
  #   To sign: install your "Developer ID Application" cert into the keychain.
  #   (Override with CSC_LINK=<path-to.p12> + CSC_KEY_PASSWORD for CI.)
  # Notarization happens in the root-level `afterSign` hook (top of this file).
  # dmg is what humans download; zip is what Squirrel.Mac (electron-updater)
  # actually updates from — latest-mac.yml points at it. Both universal.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: Guppy-${version}-mac-${arch}.${ext}

dmg:
  title: Guppy ${version}

# ---- Windows ----
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Guppy-${version}-win-x64-setup.exe
  shortcutName: Guppy
  # Re-aims taskbar pins (and renamed shortcut copies) from the old exe to Guppy.exe on update.
  include: build/installer.nsh

portable:
  artifactName: Guppy-${version}-win-x64-portable.exe

# ---- Linux ----
linux:
  category: Development
  # The .desktop Comment; without it the AppImage would say just "Guppy" (see extraMetadata).
  description: "Clones for you and your team, working 24/7 — a free, local-first multi-agent harness that turns the CLI coding agent you already run into a clone of you, coordinating an office of agents on your machine."
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  artifactName: Guppy-${version}-linux-x86_64.AppImage
