name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Guppy
        2. Add an agent with command `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output, stack traces, or a screenshot/clip if it's visual.
      render: shell
  - type: input
    id: guppy
    attributes:
      label: Guppy version
      description: Shown in the title bar next to the Guppy logo, and in Settings > General under Updates.
      placeholder: e.g. v1.1.103
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Installer (setup.exe)
        - Portable (portable.exe)
        - Source build (npm run dev / npm run build)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`.
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (if relevant)
      placeholder: claude --version
  - type: input
    id: node
    attributes:
      label: Node version (source builds only)
      placeholder: node -v
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: "Source builds only: I re-ran `npm install` so `node-pty` is rebuilt for the current Electron ABI."
