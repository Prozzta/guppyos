name: Release

# Dry-build installers for every platform, run by hand (workflow_dispatch).
# This workflow never publishes. A release has one path: the verified local cut
# (embedding model by manifest digest, release markers, code and identity
# scans, payload asar = built asar), whose assets are uploaded to the release
# by hand. A tag push used to publish CI's own build over those assets (1.1.91:
# no embedding model, natives from another toolchain).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp (used to rebuild native node-pty) imports distutils, which was
      # removed in Python 3.12. Pin 3.11 and install setuptools so the distutils
      # shim is available across all runners.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Compile (electron-vite → out/)
        run: npm run build
        env:
          # Anonymous product analytics (TELEMETRY.md). The PostHog project key
          # is public/write-only, but only official release builds inject it —
          # forks without the secret compile with '' and analytics no-ops.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          # hash only the distributable artifacts, not blockmaps/yml
          files=$(ls *.exe *.AppImage 2>/dev/null || true)
          [ -z "$files" ] && { echo "no artifacts to hash"; exit 0; }
          sha256sum $files > "SHA256SUMS-${{ matrix.os }}.txt"
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          # latest*.yml + blockmaps feed electron-updater (auto-update).
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn
